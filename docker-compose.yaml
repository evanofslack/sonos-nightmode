services:
  sonos-nightmode:
    container_name: sonos-nightmode
    build:
      context: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - SONOS_NAME=${SONOS_NAME}
      - NIGHTMODE_ON=${NIGHTMODE_ON}
      - NIGHTMODE_OFF=${NIGHTMODE_OFF}
      - SPEECH_ENHANCE_ON=${SPEECH_ENHANCE_ON}
      - SPEECH_ENHANCE_OFF=${SPEECH_ENHANCE_OFF}
      - TZ=${TZ}
